<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清澜 — 时间的质感</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif; background: #0E0E10; color: #F5F0E8; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; }
  .logo { font-size: 22px; font-weight: 600; letter-spacing: 0.2em; color: #F5F0E8; }
  .nav-links { display: flex; gap: 40px; }
  .nav-links a { color: #A8A29E; text-decoration: none; font-size: 15px; letter-spacing: 0.05em; }
  .hero { text-align: center; padding: 96px 0 80px; position: relative; }
  .hero h1 { font-size: 56px; font-weight: 500; letter-spacing: 0.08em; line-height: 1.3; }
  .hero p { font-size: 18px; color: #A8A29E; margin: 28px 0 40px; letter-spacing: 0.05em; }
  .btn-main { background: #F5F0E8; color: #0E0E10; border: none; padding: 16px 48px; font-size: 16px; font-weight: 600; letter-spacing: 0.1em; cursor: pointer; border-radius: 0; transition: opacity 400ms cubic-bezier(0.4,0,0.2,1); }
  .btn-main:hover { opacity: 0.85; }
  .hero-visual { margin-top: 64px; position: relative; }
  .hero-visual .watch { font-size: 180px; line-height: 1; display: inline-block; transition: transform 600ms cubic-bezier(0.4,0,0.2,1); }
  .hero-visual .watch:hover { transform: scale(1.02); }
  /* 次要层：细线装饰 */
  .hero-visual::after { content: ""; display: block; width: 120px; height: 1px; background: #D4AF7A; margin: 48px auto 0; }
  /* 环境层：背景光晕呼吸 */
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(212,175,122,0.08), transparent 55%); animation: breathe 3s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 0%, 100% { opacity: 0.97; } 50% { opacity: 1; } }
  .trust { text-align: center; padding: 0 0 64px; color: #78716C; font-size: 13px; letter-spacing: 0.15em; }
  /* 入场：淡入上移 20px，600ms，cubic-bezier(0.4,0,0.2,1)，依次延迟 */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .anim-h1 { animation: fadeUp 600ms cubic-bezier(0.4,0,0.2,1) both; }
  .anim-p { animation: fadeUp 600ms cubic-bezier(0.4,0,0.2,1) 120ms both; }
  .anim-btn { animation: fadeUp 600ms cubic-bezier(0.4,0,0.2,1) 240ms both; }
  .anim-visual { animation: fadeUp 600ms cubic-bezier(0.4,0,0.2,1) 360ms both; }
  @media (max-width: 768px) {
    .hero h1 { font-size: 32px; }
    .hero p { font-size: 16px; }
    .nav-links { display: none; }
    .hero { padding: 56px 0 48px; }
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <div class="logo">清澜</div>
    <div class="nav-links">
      <a href="#">系列</a>
      <a href="#">工艺</a>
      <a href="#">门店</a>
      <a href="#">关于</a>
    </div>
  </nav>
  <section class="hero">
    <h1 class="anim-h1">时间的质感</h1>
    <p class="anim-p">一枚腕表，一段值得慢慢走过的时间。</p>
    <div class="anim-btn"><button class="btn-main">了解更多</button></div>
    <div class="hero-visual anim-visual"><span class="watch">⌚</span></div>
  </section>
  <div class="trust">手工制表 · 瑞士机芯 · 五年质保</div>
</div>
</body>
</html>
