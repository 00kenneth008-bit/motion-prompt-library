<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云效 — 让团队效率看得见</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFFFFF; color: #1A1A1A; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #E5E7EB; }
  .logo { font-size: 20px; font-weight: 700; color: #2563EB; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a { color: #4B5563; text-decoration: none; font-size: 15px; }
  .nav-auth { display: flex; gap: 12px; }
  .btn-login { background: none; border: none; color: #4B5563; font-size: 15px; cursor: pointer; padding: 8px 16px; }
  .btn-signup { background: #2563EB; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 200ms cubic-bezier(0.2,0,0,1); }
  .btn-signup:hover { background: #1D4ED8; }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 72px 0 64px; }
  .hero-text h1 { font-size: 44px; font-weight: 700; line-height: 1.25; color: #111827; }
  .hero-text p { font-size: 17px; color: #6B7280; margin: 20px 0 32px; line-height: 1.6; }
  .hero-btns { display: flex; gap: 12px; }
  .btn-primary { background: #2563EB; color: #fff; border: none; padding: 13px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 200ms cubic-bezier(0.2,0,0,1); }
  .btn-primary:hover { background: #1D4ED8; }
  .btn-secondary { background: #fff; color: #2563EB; border: 1px solid #D1D5DB; padding: 13px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 200ms cubic-bezier(0.2,0,0,1); }
  .btn-secondary:hover { background: #F9FAFB; }
  .hero-visual { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 32px; }
  .chart-bar { height: 16px; background: #DBEAFE; border-radius: 4px; margin: 12px 0; overflow: hidden; }
  .chart-bar i { display: block; height: 100%; background: #2563EB; border-radius: 4px; }
  .chart-label { font-size: 14px; color: #6B7280; display: flex; justify-content: space-between; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 32px 0 56px; border-top: 1px solid #E5E7EB; }
  .metric { text-align: center; }
  .metric b { font-size: 32px; font-weight: 700; color: #111827; display: block; }
  .metric span { font-size: 14px; color: #6B7280; }
  /* 入场：淡入，400ms，cubic-bezier(0.2,0,0,1)，依次延迟 */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp12 { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .anim-h1 { animation: fadeIn 400ms cubic-bezier(0.2,0,0,1) both; }
  .anim-p { animation: fadeIn 400ms cubic-bezier(0.2,0,0,1) 80ms both; }
  .anim-btns { animation: fadeIn 400ms cubic-bezier(0.2,0,0,1) 160ms both; }
  .anim-visual { animation: fadeUp12 400ms cubic-bezier(0.2,0,0,1) 240ms both; }
  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; gap: 32px; padding: 40px 0; }
    .hero-text h1 { font-size: 30px; }
    .hero-text p { font-size: 16px; }
    .nav-links { display: none; }
    .metrics { grid-template-columns: 1fr; gap: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <div class="logo">云效</div>
    <div class="nav-links">
      <a href="#">功能</a>
      <a href="#">定价</a>
      <a href="#">客户</a>
      <a href="#">文档</a>
    </div>
    <div class="nav-auth">
      <button class="btn-login">登录</button>
      <button class="btn-signup">开始使用</button>
    </div>
  </nav>
  <section class="hero">
    <div class="hero-text">
      <h1 class="anim-h1">让团队效率看得见</h1>
      <p class="anim-p">云效把任务、进度和目标放在一处，团队每天少开一小时会。</p>
      <div class="hero-btns anim-btns">
        <button class="btn-primary">开始使用</button>
        <button class="btn-secondary">预约演示</button>
      </div>
    </div>
    <div class="hero-visual anim-visual">
      <div class="chart-label"><span>本周完成率</span><span>86%</span></div>
      <div class="chart-bar"><i style="width:86%"></i></div>
      <div class="chart-label"><span>项目准时率</span><span>92%</span></div>
      <div class="chart-bar"><i style="width:92%"></i></div>
      <div class="chart-label"><span>会议减少</span><span>38%</span></div>
      <div class="chart-bar"><i style="width:38%"></i></div>
    </div>
  </section>
  <div class="metrics">
    <div class="metric"><b data-count="12000">0</b><span>团队正在使用</span></div>
    <div class="metric"><b data-count="98">0</b><span>客户满意度 %</span></div>
    <div class="metric"><b data-count="40">0</b><span>平均节省工时 %</span></div>
  </div>
</div>
<script>
  // 次要层：数字滚动到视口时从 0 计数到目标值，800ms
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;
      const target = +el.dataset.count;
      const start = performance.now();
      const tick = (now) => {
        const p = Math.min((now - start) / 800, 1);
        el.textContent = Math.round(target * p).toLocaleString();
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      observer.unobserve(el);
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.metric b').forEach(el => observer.observe(el));
</script>
</body>
</html>
