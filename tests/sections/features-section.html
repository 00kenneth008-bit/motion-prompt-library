<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例产品 — 功能区块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F7F8FA; color: #222; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .spacer { height: 70vh; display: flex; align-items: center; justify-content: center; color: #999; font-size: 18px; }
  .sec-head { text-align: center; padding: 72px 0 40px; }
  .sec-kicker { font-size: 14px; font-weight: 700; color: #1677FF; letter-spacing: 2px; }
  .sec-head h2 { font-size: 32px; font-weight: 700; margin: 12px 0 14px; }
  .sec-head p { font-size: 17px; color: #666; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 40px; }
  .card { background: #fff; border: 1px solid #E8E8E8; border-radius: 8px; padding: 32px 28px; transition: transform 200ms cubic-bezier(0.2,0,0,1), background-color 200ms cubic-bezier(0.2,0,0,1); }
  .card:hover { transform: translateY(-4px); background-color: #FDFDFD; }
  .card-icon { font-size: 40px; display: block; margin-bottom: 18px; }
  .card h3 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .card p { font-size: 16px; color: #666; line-height: 1.7; margin-bottom: 16px; }
  .card a { color: #1677FF; font-size: 16px; text-decoration: none; position: relative; }
  .card a::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 2px; background: #1677FF; opacity: 0; transition: opacity 200ms cubic-bezier(0.2,0,0,1); }
  .card a:hover::after { opacity: 1; }
  /* 揭示：透明度 + 上移 16px，400ms，间隔 80ms；图标晚 100ms */
  .reveal { opacity: 0; transform: translateY(16px); }
  .reveal.visible { opacity: 1; transform: translateY(0); transition: opacity 400ms cubic-bezier(0.2,0,0,1), transform 400ms cubic-bezier(0.2,0,0,1); }
  .reveal.visible.d1 { transition-delay: 80ms; }
  .reveal.visible.d2 { transition-delay: 160ms; }
  .reveal.visible .card-icon { transition: opacity 400ms cubic-bezier(0.2,0,0,1); transition-delay: 100ms; }
  /* 揭示后的悬停抬升：优先级高于 .reveal.visible 的 translateY(0)，否则悬停被盖住 */
  .card.reveal.visible:hover { transform: translateY(-4px); transition: transform 200ms cubic-bezier(0.2,0,0,1), background-color 200ms cubic-bezier(0.2,0,0,1); }
  .sec-more { text-align: center; padding-bottom: 80px; }
  .btn-secondary { background: #fff; color: #1677FF; border: 1px solid #1677FF; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background-color 200ms cubic-bezier(0.2,0,0,1); }
  .btn-secondary:hover { background-color: #EAF3FF; }
  @media (max-width: 768px) {
    .cards { grid-template-columns: 1fr; }
    .sec-head h2 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="spacer">向下滚动查看功能区块 ↓</div>
  <section data-reveal-group>
    <div class="sec-head">
      <div class="sec-kicker reveal">核心功能</div>
      <h2 class="reveal d1">三个功能，一个都不少</h2>
      <p class="reveal d2">示例产品把最常用的三个能力放在一处，开箱即用。</p>
    </div>
    <div class="cards">
      <article class="card reveal">
        <span class="card-icon">📋</span>
        <h3>任务管理</h3>
        <p>看板、列表、日历三种视图自由切换，截止提醒自动推送。</p>
        <a href="#">了解更多 →</a>
      </article>
      <article class="card reveal d1">
        <span class="card-icon">📄</span>
        <h3>文档协作</h3>
        <p>多人同时编辑，改动实时同步，版本历史随时回退。</p>
        <a href="#">了解更多 →</a>
      </article>
      <article class="card reveal d2">
        <span class="card-icon">📊</span>
        <h3>数据洞察</h3>
        <p>项目进度、成员负荷、延期风险一张报表说清楚。</p>
        <a href="#">了解更多 →</a>
      </article>
    </div>
    <div class="sec-more">
      <button class="btn-secondary reveal">查看全部功能</button>
    </div>
  </section>
  <div class="spacer">— 区块结束 —</div>
</div>
<script>
(function () {
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('visible'); });
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('[data-reveal-group]').forEach(function (g) { io.observe(g); });
})();
</script>
</body>
</html>
