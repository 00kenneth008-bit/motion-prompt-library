<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例产品 — 常见问题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F7F8FA; color: #222; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 0 24px; }
  .sec-head { text-align: center; padding: 72px 0 40px; }
  .sec-kicker { font-size: 14px; font-weight: 700; color: #1677FF; letter-spacing: 2px; }
  .sec-head h2 { font-size: 32px; font-weight: 700; margin-top: 12px; }
  .faq-list { border-top: 1px solid #E8E8E8; padding-bottom: 80px; }
  .faq-item { border-bottom: 1px solid #E8E8E8; }
  .faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: none; border: none; padding: 22px 4px; font-size: 17px; font-weight: 600; color: #222; cursor: pointer; text-align: left; transition: background-color 200ms cubic-bezier(0.2,0,0,1); }
  .faq-q:hover { background-color: #F0F0F0; }
  .faq-q:focus-visible { outline: 2px solid #1677FF; outline-offset: 2px; }
  .faq-arrow { flex: none; width: 20px; height: 20px; transition: transform 350ms cubic-bezier(0.2,0,0,1); }
  .faq-item.open .faq-arrow { transform: rotate(180deg); }
  /* 答案区：grid-template-rows 0fr→1fr 过渡；文字淡入上移 8px，晚 50ms */
  .faq-answer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 350ms cubic-bezier(0.2,0,0,1); }
  .faq-item.open .faq-answer { grid-template-rows: 1fr; }
  .faq-answer-inner { overflow: hidden; }
  .faq-answer-text { font-size: 16px; color: #666; line-height: 1.8; padding: 0 4px 22px; opacity: 0; transform: translateY(8px); transition: opacity 350ms cubic-bezier(0.2,0,0,1), transform 350ms cubic-bezier(0.2,0,0,1); transition-delay: 50ms; }
  .faq-item.open .faq-answer-text { opacity: 1; transform: translateY(0); }
  @media (max-width: 768px) {
    .sec-head h2 { font-size: 26px; }
    .faq-q { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="sec-head">
    <div class="sec-kicker">常见问题</div>
    <h2>你想问的都在这里</h2>
  </div>
  <div class="faq-list" id="faqList">
    <div class="faq-item open">
      <button class="faq-q" aria-expanded="true"><span>免费版能用多久？</span><svg class="faq-arrow" viewBox="0 0 20 20" fill="none"><path d="M4 7l6 6 6-6" stroke="#222" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="faq-answer"><div class="faq-answer-inner"><p class="faq-answer-text">免费版没有时间限制，可以一直用。基础功能全部开放，升级后才解锁高级功能。</p></div></div>
    </div>
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false"><span>支持哪些支付方式？</span><svg class="faq-arrow" viewBox="0 0 20 20" fill="none"><path d="M4 7l6 6 6-6" stroke="#222" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="faq-answer"><div class="faq-answer-inner"><p class="faq-answer-text">支持信用卡、借记卡与主流电子钱包。按月或按年支付均可，年付享 8 折。</p></div></div>
    </div>
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false"><span>可以随时取消订阅吗？</span><svg class="faq-arrow" viewBox="0 0 20 20" fill="none"><path d="M4 7l6 6 6-6" stroke="#222" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="faq-answer"><div class="faq-answer-inner"><p class="faq-answer-text">可以。设置里一点就取消，当前周期结束前仍可继续使用，不会多扣费用。</p></div></div>
    </div>
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false"><span>数据可以导出吗？</span><svg class="faq-arrow" viewBox="0 0 20 20" fill="none"><path d="M4 7l6 6 6-6" stroke="#222" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="faq-answer"><div class="faq-answer-inner"><p class="faq-answer-text">可以。任务、文档与报表都支持导出，格式为 CSV 或 Markdown，数据始终属于你。</p></div></div>
    </div>
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false"><span>有客服支持吗？</span><svg class="faq-arrow" viewBox="0 0 20 20" fill="none"><path d="M4 7l6 6 6-6" stroke="#222" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="faq-answer"><div class="faq-answer-inner"><p class="faq-answer-text">有。工作日 9:00–18:00 在线客服，平均 10 分钟内回复；专业版享优先支持。</p></div></div>
    </div>
  </div>
</div>
<script>
(function () {
  var items = document.querySelectorAll('.faq-item');
  items.forEach(function (item) {
    var btn = item.querySelector('.faq-q');
    btn.addEventListener('click', function () {
      var willOpen = !item.classList.contains('open');
      items.forEach(function (it) {
        it.classList.remove('open');
        it.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      });
      if (willOpen) {
        item.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
})();
</script>
</body>
</html>
