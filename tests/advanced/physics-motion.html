<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例产品 — 物理感动效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFF8EC; color: #333; overflow-x: hidden; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  p { font-size: 17px; line-height: 1.7; color: #555; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .logo { font-size: 22px; font-weight: 800; color: #FF7A45; }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a { color: #444; text-decoration: none; font-size: 16px; }
  .hero { position: relative; text-align: center; padding: 88px 24px 64px; }
  .ambient { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: #FFE3D1; pointer-events: none; animation: ambientBob 5s ease-in-out infinite alternate; }
  .ambient.a1 { top: 20%; left: 8%; }
  .ambient.a2 { top: 30%; right: 8%; animation-delay: 1.5s; }
  @keyframes ambientBob { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  .hero h1 { font-size: 48px; font-weight: 800; margin: 16px 0; }
  .hero p { max-width: 560px; margin: 0 auto 28px; }
  .spring-btn { background: #FF7A45; color: #fff; border: none; padding: 15px 36px; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform 200ms cubic-bezier(0.68,-0.55,0.27,1.55); will-change: transform; }
  .spring-btn:hover { transform: scale(1.05); }
  .section { padding: 64px 0; text-align: center; }
  .section h2 { font-size: 32px; margin-bottom: 12px; }
  .section .hint { margin-bottom: 32px; }
  .stage { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; }
  .spring-shadow { position: absolute; width: 180px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.12); bottom: 24px; left: 50%; margin-left: -90px; will-change: transform, opacity; transition: opacity 300ms cubic-bezier(0.68,-0.55,0.27,1.55); }
  #dragCard { position: relative; width: 220px; padding: 32px 24px; background: #fff; border: 2px solid #FFD9C4; border-radius: 16px; cursor: grab; touch-action: none; user-select: none; will-change: transform; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  #dragCard:active { cursor: grabbing; }
  #dragCard h3 { font-size: 20px; margin-bottom: 8px; }
  #dragCard .reveal-note { opacity: 0; transform: translateY(16px); transition: opacity 300ms cubic-bezier(0.68,-0.55,0.27,1.55), transform 300ms cubic-bezier(0.68,-0.55,0.27,1.55); transition-delay: 80ms; }
  #dragCard.in .reveal-note { opacity: 1; transform: translateY(0); }
  /* 动量内容条 */
  #strip { display: flex; gap: 16px; overflow-x: auto; padding: 8px 4px 20px; cursor: grab; scrollbar-width: none; user-select: none; }
  #strip::-webkit-scrollbar { display: none; }
  #strip .mini { flex: 0 0 220px; background: #fff; border: 1px solid #F0E0D0; border-radius: 16px; padding: 24px; text-align: left; opacity: 0; transform: translateY(16px); transition: opacity 250ms cubic-bezier(0.68,-0.55,0.27,1.55), transform 250ms cubic-bezier(0.68,-0.55,0.27,1.55); }
  #strip .mini:nth-child(2) { transition-delay: 160ms; }
  #strip .mini:nth-child(3) { transition-delay: 80ms; }
  #strip .mini:nth-child(4) { transition-delay: 160ms; }
  #strip .mini:nth-child(5) { transition-delay: 80ms; }
  #strip.in .mini { opacity: 1; transform: translateY(0); }
  #strip .mini h3 { font-size: 18px; margin-bottom: 8px; }
  .cta { text-align: center; padding: 64px 24px 80px; }
  .cta h2 { font-size: 32px; margin-bottom: 24px; }
  footer { text-align: center; padding: 32px; color: #888; font-size: 16px; border-top: 1px solid #F0E6D8; }
  @media (max-width: 768px) {
    .hero h1 { font-size: 34px; }
    .nav-links a { display: none; }
    #strip .mini { flex-basis: 200px; }
  }
</style>
</head>
<body>
<nav><div class="logo">示例产品</div><div class="nav-links"><a href="#">玩法</a><a href="#">内容</a><a href="#">关于</a></div></nav>
<header class="hero">
  <div class="ambient a1"></div><div class="ambient a2"></div>
  <h1>拖一拖，弹回来</h1>
  <p>这页的动效不是写死的过渡，是真实弹簧算出来的。动手试试下面这张卡片。</p>
  <button class="spring-btn" id="springBtn" type="button">点我弹一下</button>
</header>
<section class="section"><div class="container">
  <h2>可拖拽卡片</h2>
  <p class="hint">拖动我，松手看回弹</p>
  <div class="stage">
    <div class="spring-shadow" id="cardShadow"></div>
    <div id="dragCard"><h3>示例卡片</h3><p class="reveal-note">示例说明文字，松手后我会弹回原位。</p></div>
  </div>
</div></section>
<section class="section"><div class="container">
  <h2>动量内容条</h2>
  <p class="hint">横向拖动，松手后它会自己滑一段再停稳</p>
  <div id="strip">
    <div class="mini"><h3>示例卡片一</h3><p>示例一句话说明。</p></div>
    <div class="mini"><h3>示例卡片二</h3><p>示例一句话说明。</p></div>
    <div class="mini"><h3>示例卡片三</h3><p>示例一句话说明。</p></div>
    <div class="mini"><h3>示例卡片四</h3><p>示例一句话说明。</p></div>
    <div class="mini"><h3>示例卡片五</h3><p>示例一句话说明。</p></div>
  </div>
</div></section>
<section class="cta"><h2>好玩吗？开始体验吧</h2><button class="spring-btn" type="button">开始体验</button></section>
<footer>示例产品 · 页脚占位文字</footer>
<script>
  // 弹簧参数（与提示词一致）
  var stiffness = 180, damping = 14, mass = 1;
  var card = document.getElementById('dragCard');
  var shadow = document.getElementById('cardShadow');
  var pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
  var dragging = false, lastX = 0, lastY = 0, lastT = 0, springRaf = null;
  function renderCard() {
    card.style.transform = 'translate(' + pos.x + 'px, ' + pos.y + 'px)';
    shadow.style.transform = 'translate(' + (pos.x * 0.4) + 'px, ' + (pos.y * 0.4) + 'px) scale(' + (1 - Math.min(0.2, Math.abs(pos.x) / 1000)) + ')';
    shadow.style.opacity = String(1 - Math.min(0.3, Math.abs(pos.x) / 800));
  }
  function springStep() {
    var dt = 1 / 60;
    var ax = (-stiffness * pos.x - damping * vel.x) / mass;
    var ay = (-stiffness * pos.y - damping * vel.y) / mass;
    vel.x += ax * dt; vel.y += ay * dt;
    pos.x += vel.x * dt; pos.y += vel.y * dt;
    renderCard();
    if (Math.abs(pos.x) < 0.5 && Math.abs(pos.y) < 0.5 && Math.abs(vel.x) < 0.5 && Math.abs(vel.y) < 0.5) {
      pos.x = 0; pos.y = 0; vel.x = 0; vel.y = 0; renderCard(); springRaf = null; return;
    }
    springRaf = requestAnimationFrame(springStep);
  }
  card.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    vel.x = 0; vel.y = 0;
    if (springRaf) { cancelAnimationFrame(springRaf); springRaf = null; }
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    var dt = Math.max(1, now - lastT);
    vel.x = dx / dt * 16; vel.y = dy / dt * 16;
    pos.x += dx; pos.y += dy;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    renderCard();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    springRaf = requestAnimationFrame(springStep);
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);
  // 弹簧按钮：同一组弹簧参数做超调回弹
  var btn = document.getElementById('springBtn');
  btn.addEventListener('click', function () {
    var s = 1.1, v = 0, raf = null;
    function step() {
      var dt = 1 / 60;
      var a = (-stiffness * (s - 1) - damping * v) / mass;
      v += a * dt; s += v * dt;
      btn.style.transform = 'scale(' + s.toFixed(3) + ')';
      if (Math.abs(s - 1) < 0.002 && Math.abs(v) < 0.01) { btn.style.transform = 'scale(1)'; return; }
      raf = requestAnimationFrame(step);
    }
    if (raf) cancelAnimationFrame(raf);
    step();
  });
  // 动量内容条
  var strip = document.getElementById('strip');
  var sDrag = false, sLastX = 0, sVel = 0, sLastT = 0, sRaf = null;
  strip.addEventListener('pointerdown', function (e) {
    sDrag = true; sLastX = e.clientX; sLastT = performance.now(); sVel = 0;
    if (sRaf) { cancelAnimationFrame(sRaf); sRaf = null; }
  });
  strip.addEventListener('pointermove', function (e) {
    if (!sDrag) return;
    var now = performance.now();
    var dx = e.clientX - sLastX;
    sVel = dx / Math.max(1, now - sLastT) * 16;
    strip.scrollLeft -= dx;
    sLastX = e.clientX; sLastT = now;
  });
  function sEnd() {
    if (!sDrag) return;
    sDrag = false;
    function glide() {
      sVel *= 0.95;
      strip.scrollLeft -= sVel;
      if (strip.scrollLeft <= 0) { strip.scrollLeft = 0; sVel = 0; }
      var max = strip.scrollWidth - strip.clientWidth;
      if (strip.scrollLeft >= max) { strip.scrollLeft = max; sVel = 0; }
      if (Math.abs(sVel) < 0.5) { sRaf = null; return; }
      sRaf = requestAnimationFrame(glide);
    }
    sRaf = requestAnimationFrame(glide);
  }
  strip.addEventListener('pointerup', sEnd);
  strip.addEventListener('pointercancel', sEnd);
  // 入场
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        if (e.target.id === 'strip') e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });
  io.observe(card);
  io.observe(strip);
</script>
</body>
</html>
