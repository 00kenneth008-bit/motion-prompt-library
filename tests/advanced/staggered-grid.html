<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例活动 — 交错网格编排</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #111114; color: #F2F0EA; overflow-x: hidden; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  p { font-size: 17px; line-height: 1.7; color: #C9C7C0; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .logo { font-size: 22px; font-weight: 800; color: #F2F0EA; }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a { color: #C9C7C0; text-decoration: none; font-size: 16px; }
  .hero { position: relative; text-align: center; padding: 88px 24px 64px; }
  .ambient { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 1px solid #3A3A40; pointer-events: none; animation: ambientFloat 5s ease-in-out infinite alternate; }
  .ambient.a1 { top: 18%; left: 7%; }
  .ambient.a2 { top: 40%; right: 7%; animation-delay: 1.5s; }
  @keyframes ambientFloat { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  .kicker { font-size: 15px; letter-spacing: 4px; color: #F5D90A; font-weight: 600; }
  .hero h1 { font-size: 46px; font-weight: 800; margin: 16px 0; }
  .hero p { max-width: 560px; margin: 0 auto; }
  .section { padding: 56px 0 72px; }
  .section h2 { font-size: 32px; text-align: center; margin-bottom: 36px; }
  .grid-wrap { position: relative; }
  #spotlight { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #F5D90A; opacity: 0; pointer-events: none; z-index: 0; transition: transform 150ms cubic-bezier(0.16,1,0.3,1), opacity 150ms cubic-bezier(0.16,1,0.3,1); }
  .grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .grid-card { background: #1D1D21; border: 1px solid #33333A; border-radius: 12px; padding: 28px 22px; opacity: 0; transform: translateY(20px); transition: opacity 250ms cubic-bezier(0.16,1,0.3,1), transform 250ms cubic-bezier(0.16,1,0.3,1), border-color 200ms cubic-bezier(0.16,1,0.3,1); }
  .grid-card.stagger-0 { transition-delay: 0ms, 0ms, 0ms; }
  .grid-card.stagger-1 { transition-delay: 60ms, 60ms, 0ms; }
  .grid-card.stagger-2 { transition-delay: 120ms, 120ms, 0ms; }
  .grid-card.stagger-3 { transition-delay: 180ms, 180ms, 0ms; }
  .grid.in .grid-card { opacity: 1; transform: translateY(0); }
  .grid.in .grid-card:hover { transform: translateY(-4px); border-color: #F5D90A; }
  .grid.has-focus .grid-card { opacity: 0.5; }
  .grid.has-focus .grid-card.lit { opacity: 1; border-color: #F5D90A; }
  .grid-card .num { font-size: 15px; color: #F5D90A; font-weight: 700; letter-spacing: 2px; }
  .grid-card h3 { font-size: 20px; margin: 10px 0 8px; }
  .grid-caption { opacity: 0; transform: translateY(6px); transition: opacity 250ms cubic-bezier(0.16,1,0.3,1), transform 250ms cubic-bezier(0.16,1,0.3,1); transition-delay: 100ms; }
  .grid.in .grid-caption { opacity: 1; transform: translateY(0); }
  .btn { background: #F5D90A; color: #111114; border: none; padding: 14px 32px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; transition: opacity 200ms cubic-bezier(0.16,1,0.3,1); }
  .btn:hover { opacity: 0.85; }
  .cta { text-align: center; padding: 64px 24px 80px; }
  .cta h2 { font-size: 32px; margin-bottom: 24px; }
  footer { text-align: center; padding: 32px; color: #888; font-size: 16px; border-top: 1px solid #26262B; }
  @media (max-width: 768px) {
    .hero h1 { font-size: 34px; }
    .grid { grid-template-columns: 1fr; }
    .nav-links a { display: none; }
    #spotlight { width: 60px; height: 60px; }
  }
</style>
</head>
<body>
<nav><div class="logo">示例活动</div><div class="nav-links"><a href="#">卡片</a><a href="#">关于</a><a href="#">参与</a></div></nav>
<header class="hero">
  <div class="ambient a1"></div><div class="ambient a2"></div>
  <div class="kicker">示例活动 · 作品墙</div>
  <h1>八张卡片，一波推来</h1>
  <p>向下滚动，看卡片像波浪一样依次浮现；鼠标移到哪张，哪张就亮起来。</p>
</header>
<section class="section"><div class="container">
  <h2>示例卡片墙</h2>
  <div class="grid-wrap" id="gridWrap">
    <div id="spotlight"></div>
    <div class="grid" id="grid">
      <div class="grid-card stagger-0"><div class="num">示例 01</div><h3>示例卡片一</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-1"><div class="num">示例 02</div><h3>示例卡片二</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-2"><div class="num">示例 03</div><h3>示例卡片三</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-3"><div class="num">示例 04</div><h3>示例卡片四</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-0"><div class="num">示例 05</div><h3>示例卡片五</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-1"><div class="num">示例 06</div><h3>示例卡片六</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-2"><div class="num">示例 07</div><h3>示例卡片七</h3><p class="grid-caption">示例一句话说明。</p></div>
      <div class="grid-card stagger-3"><div class="num">示例 08</div><h3>示例卡片八</h3><p class="grid-caption">示例一句话说明。</p></div>
    </div>
  </div>
</div></section>
<section class="cta"><h2>喜欢哪张？立即参与</h2><button class="btn" type="button">立即参与</button></section>
<footer>示例活动 · 页脚占位文字</footer>
<script>
  var grid = document.getElementById('grid');
  var wrap = document.getElementById('gridWrap');
  var spot = document.getElementById('spotlight');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { grid.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  io.observe(grid);
  wrap.addEventListener('mousemove', function (e) {
    var r = wrap.getBoundingClientRect();
    var x = e.clientX - r.left - 60, y = e.clientY - r.top - 60;
    spot.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    spot.style.opacity = '0.15';
    var card = e.target.closest('.grid-card');
    grid.classList.add('has-focus');
    document.querySelectorAll('.grid-card').forEach(function (c) { c.classList.remove('lit'); });
    if (card) card.classList.add('lit');
  });
  wrap.addEventListener('mouseleave', function () {
    spot.style.opacity = '0';
    grid.classList.remove('has-focus');
    document.querySelectorAll('.grid-card').forEach(function (c) { c.classList.remove('lit'); });
  });
</script>
</body>
</html>
