<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例产品 — 按钮组件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFF9F2; color: #222; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; }
  /* 环境层：漂浮小图形 */
  .float-shape { position: absolute; font-size: 22px; opacity: 0.5; pointer-events: none; animation: drift 3000ms ease-in-out infinite alternate; }
  .float-shape.s1 { top: 120px; left: 4%; }
  .float-shape.s2 { top: 320px; right: 5%; animation-delay: 400ms; }
  .float-shape.s3 { top: 640px; left: 8%; animation-delay: 800ms; }
  @keyframes drift { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
  .page-head { text-align: center; padding: 64px 0 40px; }
  .page-head h1 { font-size: 32px; font-weight: 800; }
  .page-head p { font-size: 17px; color: #666; margin-top: 12px; }
  .btn-group { background: #fff; border: 1px solid #F0E4D8; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .btn-group h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .btn-group .hint { font-size: 16px; color: #888; margin-bottom: 20px; }
  .btn-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  /* 三种按钮 */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; padding: 13px 26px; border-radius: 16px; cursor: pointer; border: none; transition: transform 200ms cubic-bezier(0.68,-0.55,0.27,1.55); }
  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.95); transition: transform 150ms cubic-bezier(0.68,-0.55,0.27,1.55); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary { background: #FF7A1A; color: #fff; }
  .btn-primary::after { content: ''; position: absolute; inset: 0; border-radius: 16px; box-shadow: 0 10px 24px rgba(255,122,26,0.45); opacity: 0; transition: opacity 200ms cubic-bezier(0.68,-0.55,0.27,1.55); pointer-events: none; }
  .btn-primary:hover::after { opacity: 1; }
  .btn-secondary { background: #FFF1E6; color: #E56A00; border: 2px solid #FFB37A; }
  .btn-secondary:hover { border-color: #FF7A1A; }
  .btn-ghost { background: transparent; color: #E56A00; border: 2px dashed #FFB37A; }
  .btn-ghost:hover { border-color: #FF7A1A; }
  .btn-icon { display: inline-block; transition: opacity 200ms cubic-bezier(0.68,-0.55,0.27,1.55); transition-delay: 50ms; }
  /* 涟漪：点击点缩放 0→1 并淡出 */
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.55); transform: scale(0); animation: ripple 400ms ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  /* 入场：弹入 300ms，间隔 80ms */
  .reveal { opacity: 0; transform: translateY(12px) scale(0.95); }
  .reveal.visible { opacity: 1; transform: translateY(0) scale(1); transition: opacity 300ms cubic-bezier(0.68,-0.55,0.27,1.55), transform 300ms cubic-bezier(0.68,-0.55,0.27,1.55); }
  .reveal.visible.d1 { transition-delay: 80ms; }
  .reveal.visible.d2 { transition-delay: 160ms; }
  .page-foot { text-align: center; color: #999; font-size: 14px; padding: 16px 0 48px; }
  @media (max-width: 768px) {
    .btn-row { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
    .page-head h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="container">
  <span class="float-shape s1">⭐</span>
  <span class="float-shape s2">●</span>
  <span class="float-shape s3">✦</span>
  <div class="page-head">
    <h1>按钮组件</h1>
    <p>主按钮、次按钮、幽灵按钮，每种都有悬停、点击、禁用三种状态，逐个试试看。</p>
  </div>
  <section class="btn-group reveal">
    <h2>主按钮</h2>
    <p class="hint">最重要的操作用它，页面上一次只放一个主按钮。</p>
    <div class="btn-row">
      <button class="btn btn-primary"><span class="btn-icon">🚀</span>开始使用</button>
      <button class="btn btn-primary"><span class="btn-icon">💾</span>保存</button>
      <button class="btn btn-primary" disabled><span class="btn-icon">🚀</span>开始使用（禁用）</button>
    </div>
  </section>
  <section class="btn-group reveal d1">
    <h2>次按钮</h2>
    <p class="hint">次要操作用它，放在主按钮旁边，不抢注意力。</p>
    <div class="btn-row">
      <button class="btn btn-secondary"><span class="btn-icon">👀</span>查看详情</button>
      <button class="btn btn-secondary"><span class="btn-icon">↩️</span>返回上一步</button>
      <button class="btn btn-secondary" disabled><span class="btn-icon">👀</span>查看详情（禁用）</button>
    </div>
  </section>
  <section class="btn-group reveal d2">
    <h2>幽灵按钮</h2>
    <p class="hint">最轻的操作用它，只有边框，没有底色。</p>
    <div class="btn-row">
      <button class="btn btn-ghost"><span class="btn-icon">✏️</span>编辑</button>
      <button class="btn btn-ghost"><span class="btn-icon">🗑️</span>删除</button>
      <button class="btn btn-ghost" disabled><span class="btn-icon">✏️</span>编辑（禁用）</button>
    </div>
  </section>
  <p class="page-foot">悬停放大 1.05 · 按下缩小 0.95 · 禁用态无反应</p>
</div>
<script>
(function () {
  // 入场弹入
  document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('visible'); });
  // 点击涟漪：从点击点缩放 0→1 并淡出，动画结束后移除
  document.querySelectorAll('.btn:not(:disabled)').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height) * 2;
      var rip = document.createElement('span');
      rip.className = 'ripple';
      rip.style.width = size + 'px';
      rip.style.height = size + 'px';
      rip.style.left = (e.clientX - rect.left - size / 2) + 'px';
      rip.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(rip);
      setTimeout(function () { rip.remove(); }, 400);
    });
  });
})();
</script>
</body>
</html>
